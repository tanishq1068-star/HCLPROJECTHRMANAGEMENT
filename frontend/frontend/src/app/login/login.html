<div class="login-page">

  <div class="login-container">

    <div class="brand-section">

      <div class="brand-icon">
        HR
      </div>

      <h1>HRGenius</h1>

      <p>
        Smart Human Resource Management
      </p>

    </div>


    <div class="login-card">

      <div class="login-header">

        <h2>Welcome Back</h2>

        <p>
          Sign in to your HRGenius account
        </p>

      </div>


      <form
        (submit)="login(); $event.preventDefault()">


        <div class="form-group">

          <label>
            Email Address
          </label>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="admin@hrgenius.com"
            autocomplete="email"
            required
          />

        </div>


        <div class="form-group">

          <label>
            Password
          </label>

          <div class="password-input">

            <input
              [type]="
                showPassword
                  ? 'text'
                  : 'password'
              "
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="show-btn"
              (click)="togglePassword()">

              {{
                showPassword
                  ? 'Hide'
                  : 'Show'
              }}

            </button>

          </div>

        </div>


        <div
          class="error-message"
          *ngIf="errorMessage">

          <span>!</span>

          <p>
            {{ errorMessage }}
          </p>

        </div>


        <button
          type="submit"
          class="login-btn">
          Sign In
        </button>


      </form>


      <div class="login-footer">

        <p>
          HRGenius Human Resource Management System
        </p>

      </div>

    </div>


    <div class="demo-info">

      <strong>Demo Login</strong>

      <span>
        admin@hrgenius.com
      </span>

      <span>
        Admin@123
      </span>

    </div>

  </div>

</div>
